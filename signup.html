<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign up — Stackly</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Newsreader:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head>
<body class="auth-page" style="--accent:var(--services-a);--accent-soft:#397A6326"><main class="auth-layout"><section class="auth-brand"><a href="index.html" class="logo"><img src="assets/images/stackly-logo.webp" alt="Stackly" class="brand-logo"></a><div class="auth-copy"><span class="eyebrow mono">Start for free</span><h1>Make room for work that matters.</h1><p>Create your workspace in seconds. Pick a personal or administrator account to open the right dashboard.</p></div><span class="auth-note">No credit card required.</span></section><section class="auth-main"><form class="auth-card" data-auth-form><h2>Create account</h2><p class="auth-subtitle">Tell us how you will use Stackly.</p><span class="role-label">ACCOUNT TYPE</span><div class="role-picker"><label class="role-option"><input type="radio" name="role" value="user" checked><span>Personal user</span></label><label class="role-option"><input type="radio" name="role" value="admin"><span>Administrator</span></label></div><div class="field"><label for="signup-name">FULL NAME</label><input id="signup-name" name="name" type="text" placeholder="Your name" required></div><div class="field"><label for="signup-email">EMAIL</label><input id="signup-email" name="email" type="email" placeholder="you@company.com" required></div><div class="field"><label for="signup-password">PASSWORD</label><input id="signup-password" name="password" type="password" placeholder="At least 6 characters" minlength="6" required></div><button class="btn btn-solid auth-submit" type="submit">Create account</button><p class="form-error" aria-live="polite"></p><p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p></form></section></main><script src="auth.js"></script></body></html>
