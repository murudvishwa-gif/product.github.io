<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in — Stackly</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Newsreader:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head>
<body class="auth-page" style="--accent:var(--home-a);--accent-soft:#E8A33D26"><main class="auth-layout"><section class="auth-brand"><a href="index.html" class="logo"><img src="assets/images/stackly-logo.webp" alt="Stackly" class="brand-logo"></a><div class="auth-copy"><span class="eyebrow mono">Welcome back</span><h1>Your best workday starts here.</h1><p>Sign in to return to your tasks, schedule, team, and everything you are building.</p></div><span class="auth-note">Plan the day, not just the list.</span></section><section class="auth-main"><form class="auth-card" data-auth-form><h2>Log in</h2><p class="auth-subtitle">Choose your account type and enter your details.</p><span class="role-label">ACCOUNT TYPE</span><div class="role-picker"><label class="role-option"><input type="radio" name="role" value="user" checked><span>Personal user</span></label><label class="role-option"><input type="radio" name="role" value="admin"><span>Administrator</span></label></div><div class="field"><label for="login-email">EMAIL</label><input id="login-email" name="email" type="email" placeholder="you@company.com" required></div><div class="field"><label for="login-password">PASSWORD</label><input id="login-password" name="password" type="password" placeholder="Enter your password" minlength="6" required></div><div class="forgot-password"><a href="404.html">Forgot password?</a></div><button class="btn btn-solid auth-submit" type="submit">Log in to dashboard</button><p class="form-error" aria-live="polite"></p><p class="auth-switch">New to Stackly? <a href="signup.html">Create an account</a></p></form></section></main><script src="auth.js"></script></body></html>
